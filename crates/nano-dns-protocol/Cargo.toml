[package]
name = "nano-dns-protocol"
description = "DNS UDP/TCP transport layer for NanoDNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["blocker"]
blocker = ["dep:nano-dns-blocker"]
recursive = ["nano-dns-resolver/recursive"]
sqlite = ["dep:nano-dns-storage"]
statistics = ["dep:nano-dns-stats"]

[dependencies]
nano-dns-blocker = { workspace = true, optional = true }
nano-dns-cache.workspace = true
nano-dns-core.workspace = true
nano-dns-resolver.workspace = true
nano-dns-stats = { workspace = true, optional = true }
nano-dns-storage = { workspace = true, optional = true }
hickory-server.workspace = true
hickory-proto.workspace = true
async-trait.workspace = true
ipnet.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt", "macros", "rt-multi-thread"] }
