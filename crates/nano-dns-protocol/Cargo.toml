[package]
name = "nano-dns-protocol"
description = "DNS UDP/TCP transport layer for NanoDNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
nano-dns-blocker.workspace = true
nano-dns-cache.workspace = true
nano-dns-core.workspace = true
nano-dns-resolver.workspace = true
nano-dns-stats.workspace = true
nano-dns-storage.workspace = true
hickory-server.workspace = true
hickory-proto.workspace = true
rustls.workspace = true
async-trait.workspace = true
ipnet.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
rcgen = "0.13"
rusqlite.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
