[package]
name = "nano-dns-resolver"
description = "Forwarding and recursive DNS resolvers for NanoDNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
recursive = []
dnssec = ["hickory-net/dnssec-ring", "dep:hickory-net", "dep:futures-util"]

[dependencies]
nano-dns-core.workspace = true
hickory-proto.workspace = true
hickory-net = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "time", "io-util"] }
